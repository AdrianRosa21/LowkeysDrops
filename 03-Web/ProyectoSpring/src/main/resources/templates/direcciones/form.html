<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dirección - Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2 th:text="${idDireccion == null ? 'Nueva Dirección' : 'Editar Dirección'}">Dirección</h2>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card" style="max-width: 600px;">
            <form th:action="@{${idDireccion == null ? '/cliente/direcciones/nueva' : '/cliente/direcciones/' + idDireccion + '/editar'}}" th:object="${direccion}" method="post">
                
                <div class="form-group">
                    <label>Tipo (Solo 1 CASA y 1 TRABAJO por usuario)</label>
                    <select th:field="*{tipo}" class="form-control" required>
                        <option value="CASA">CASA</option>
                        <option value="TRABAJO">TRABAJO</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Departamento</label>
                    <input type="text" th:field="*{departamento}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label>Municipio</label>
                    <input type="text" th:field="*{municipio}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Dirección completa</label>
                    <textarea th:field="*{direccionTexto}" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label>Referencia</label>
                    <input type="text" th:field="*{referencia}" class="form-control">
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn">Guardar</button>
                    <a href="/cliente/direcciones" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
