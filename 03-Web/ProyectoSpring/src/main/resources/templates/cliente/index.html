<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Cuenta - Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Bienvenido, <span th:text="${userName}"></span></h2>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="dashboard-grid">
            <a href="/catalogo" class="dash-card">
                <h3>Catálogo</h3>
            </a>
            <a href="/cliente/perfil" class="dash-card">
                <h3>Mi Perfil</h3>
            </a>
            <a href="/cliente/direcciones" class="dash-card">
                <h3>Mis Direcciones</h3>
            </a>
            <a href="/cliente/mis-pedidos" class="dash-card">
                <h3>Mis Pedidos</h3>
            </a>
            <a href="/logout" class="dash-card" style="border-color: var(--error);">
                <h3>Cerrar Sesión</h3>
            </a>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
