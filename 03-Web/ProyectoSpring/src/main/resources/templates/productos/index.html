<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Productos</h2>
            <a href="/admin/productos/nuevo" class="btn">Nuevo Producto</a>
        </div>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.idProducto}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.idCategoria}"></td>
                        <td th:text="${'$' + p.precio}"></td>
                        <td th:text="${p.stock}"></td>
                        <td>
                            <span class="badge" th:text="${p.estado}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/productos/' + ${p.idProducto} + '/editar'}" class="btn" style="padding: 0.5rem 1rem;">Editar</a>
                            <form th:action="@{'/admin/productos/' + ${p.idProducto} + '/eliminar'}" method="post" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar este producto?');">
                                <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem;">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
