<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lowkeys Drops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background-color: var(--card-bg);
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hero p {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="hero">
        <h1>Bienvenido a Lowkeys Drops</h1>
        <p>Tu tienda de streetwear y ropa alternativa. Descubre las piezas más exclusivas, 
        diseños oscuros y prendas únicas.</p>
        <a href="/catalogo" class="btn">Ver Catálogo</a>
    </div>

    <div class="container">
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <h2 style="text-align: center; margin-bottom: 2rem;">Productos Destacados</h2>
        
        <div class="product-grid" th:if="${destacados != null}">
            <div class="product-card" th:each="p : ${destacados}">
                <img th:if="${p.imagenUrl != null and !p.imagenUrl.isEmpty()}" th:src="${p.imagenUrl}" alt="Producto" class="product-img" onerror="this.src='/img/placeholder.png'">
                <div th:unless="${p.imagenUrl != null and !p.imagenUrl.isEmpty()}" class="product-img" style="display:flex;align-items:center;justify-content:center;color:#666">
                    Sin imagen
                </div>
                
                <div class="product-info">
                    <h3 class="product-title" th:text="${p.nombre}">Nombre</h3>
                    <div class="product-price" th:text="${'$' + p.precio}">$0.00</div>
                    <div class="product-meta">
                        <div>Categoría: <span th:text="${p.categoria}"></span></div>
                        <div th:if="${p.talla != null}">Talla: <span th:text="${p.talla}"></span></div>
                        <div style="margin-top: 0.5rem;">
                            <span class="badge" th:text="${p.estado}"></span>
                            <span class="badge" th:if="${p.esUnico}" style="background-color:var(--accent)">Única</span>
                        </div>
                    </div>
                    
                    <a th:if="${userRole == 'CLIENTE' and p.estado == 'DISPONIBLE' and p.stock > 0}" th:href="@{/cliente/pedidos/nuevo(idProducto=${p.idProducto})}" class="btn" style="width:100%">Comprar</a>
                    <a th:if="${userRole == null and p.estado == 'DISPONIBLE' and p.stock > 0}" href="/login" class="btn btn-secondary" style="width:100%; box-sizing: border-box;">Inicia sesión para comprar</a>
                    <button th:if="${p.estado != 'DISPONIBLE' or p.stock == 0}" class="btn" style="width:100%; background-color:#555; cursor:not-allowed;" disabled>No disponible</button>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
