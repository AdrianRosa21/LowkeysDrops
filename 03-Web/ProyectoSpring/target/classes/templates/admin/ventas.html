<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Ventas Completadas</h2>
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha Pedido</th>
                        <th>Fecha Entrega</th>
                        <th>Cliente</th>
                        <th>Repartidor</th>
                        <th>Método Pago</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.idPedido}"></td>
                        <td th:text="${#strings.substring(v.fechaPedido,0,10)}"></td>
                        <td th:text="${v.fechaEntrega != null ? #strings.substring(v.fechaEntrega,0,10) : ''}"></td>
                        <td th:text="${v.cliente}"></td>
                        <td th:text="${v.repartidor}"></td>
                        <td th:text="${v.metodoPago}"></td>
                        <td th:text="${'$' + v.total}" style="color:var(--accent); font-weight:bold;"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
