<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Pedidos - Lowkeys Drops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Mis Pedidos</h2>
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table th:if="${pedidos != null and not #lists.isEmpty(pedidos)}">
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha</th>
                        <th>Estado Pedido</th>
                        <th>Total</th>
                        <th>MÃ©todo Pago</th>
                        <th>Estado Pago</th>
                        <th>Repartidor</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.idPedido}"></td>
                        <td th:text="${#strings.substring(p.fechaPedido,0,10)}"></td>
                        <td><span class="badge" th:text="${p.estadoPedido}"></span></td>
                        <td th:text="${'$' + p.total}" style="color:var(--accent); font-weight:bold;"></td>
                        <td th:text="${p.metodoPago}"></td>
                        <td th:text="${p.estadoPago}"></td>
                        <td th:text="${p.repartidor}"></td>
                        <td><a th:href="@{'/cliente/pedidos/' + ${p.idPedido}}" class="btn" style="padding: 0.5rem 1rem;">Ver</a></td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${pedidos == null or #lists.isEmpty(pedidos)}" style="text-align: center; padding: 2rem;">
                <p>No tienes ningÃºn pedido registrado aÃºn.</p>
                <a href="/catalogo" class="btn" style="margin-top: 1rem;">Ir al CatÃ¡logo</a>
            </div>
        </div>
        
        <div style="margin-top: 2rem;">
            <a href="/cliente" class="btn">Volver al Dashboard</a>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
