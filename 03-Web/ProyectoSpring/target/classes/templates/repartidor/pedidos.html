<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos Disponibles - Repartidor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Pedidos Disponibles</h2>
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Dirección</th>
                        <th>Referencia</th>
                        <th>Total</th>
                        <th>Método Pago</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.idPedido}"></td>
                        <td th:text="${#strings.substring(p.fechaPedido,0,10)}"></td>
                        <td th:text="${p.cliente}"></td>
                        <td th:text="${p.departamento + ', ' + p.municipio + ' - ' + p.direccionTexto}"></td>
                        <td th:text="${p.referencia}"></td>
                        <td th:text="${'$' + p.total}"></td>
                        <td th:text="${p.metodoPago}"></td>
                        <td>
                            <form th:action="@{'/repartidor/pedidos/' + ${p.idPedido} + '/tomar'}" method="post">
                                <button type="submit" class="btn">Tomar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
