<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Lowkeys Drops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div style="max-width: 400px; margin: 0 auto; margin-top: 4rem;">
            <h2>Iniciar sesión</h2>
            <div th:replace="~{fragments/messages :: messages}"></div>
            
            <div class="card">
                <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{contrasena}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn" style="width:100%">Entrar</button>
                </form>
            </div>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/registro">¿No tienes cuenta? Regístrate</a>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
