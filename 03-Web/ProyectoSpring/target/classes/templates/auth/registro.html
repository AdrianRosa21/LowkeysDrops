<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Lowkeys Drops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div style="max-width: 500px; margin: 0 auto; margin-top: 2rem;">
            <h2>Crear cuenta</h2>
            <div th:replace="~{fragments/messages :: messages}"></div>
            
            <div class="card">
                <form th:action="@{/registro}" th:object="${registroRequest}" method="post">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{contrasena}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>DUI (00000000-0)</label>
                        <input type="text" th:field="*{dui}" class="form-control" required pattern="[0-9]{8}-[0-9]" title="Debe tener el formato 00000000-0">
                    </div>
                    <button type="submit" class="btn" style="width:100%">Registrarme</button>
                </form>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
