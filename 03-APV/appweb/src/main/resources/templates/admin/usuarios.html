<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Usuarios Registrados</h2>
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>DUI</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.idUsuario}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.correo}"></td>
                        <td th:text="${u.telefono}"></td>
                        <td th:text="${u.dui}"></td>
                        <td><span class="badge" th:text="${u.rol}"></span></td>
                        <td><span class="badge" th:text="${u.estado ? 'Activo' : 'Inactivo'}"></span></td>
                        <td>
                            <form th:action="@{'/admin/usuarios/' + ${u.idUsuario} + '/estado'}" method="post" style="display:inline;">
                                <input type="hidden" name="activo" th:value="${!u.estado}">
                                <button type="submit" class="btn" th:classappend="${u.estado ? 'btn-danger' : ''}" th:text="${u.estado ? 'Desactivar' : 'Activar'}" style="padding: 0.5rem 1rem;"></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
