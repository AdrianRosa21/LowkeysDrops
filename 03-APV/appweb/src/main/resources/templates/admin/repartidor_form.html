<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Repartidor - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Nuevo Repartidor</h2>
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card" style="max-width: 600px;">
            <form th:action="@{/admin/repartidores/nuevo}" th:object="${registroRequest}" method="post">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" th:field="*{correo}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>DUI (opcional/referencia)</label>
                    <input type="text" th:field="*{dui}" class="form-control" value="00000000-0">
                </div>
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn">Crear Repartidor</button>
                    <a href="/admin/usuarios" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
