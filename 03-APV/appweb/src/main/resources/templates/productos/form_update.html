<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Editar Producto</h2>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card" style="max-width: 600px;">
            <form th:action="@{'/admin/productos/' + ${idProducto} + '/editar'}" th:object="${producto}" method="post">
                
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Talla</label>
                    <input type="text" th:field="*{talla}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required min="0.01">
                </div>

                <div class="form-group">
                    <label>Imagen URL</label>
                    <input type="text" th:field="*{imagenUrl}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" th:field="*{esUnico}"> Es Único (1 solo en stock)
                    </label>
                </div>

                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" th:field="*{stock}" class="form-control" required min="0">
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select th:field="*{estado}" class="form-control" required>
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="APARTADO">APARTADO</option>
                        <option value="VENDIDO">VENDIDO</option>
                    </select>
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn">Guardar</button>
                    <a href="/admin/productos" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
