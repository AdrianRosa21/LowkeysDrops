<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Direcciones - Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Mis Direcciones</h2>
            <a href="/cliente/direcciones/nueva" class="btn">Nueva Dirección</a>
        </div>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Departamento</th>
                        <th>Municipio</th>
                        <th>Dirección</th>
                        <th>Referencia</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${direcciones}">
                        <td><span class="badge" th:text="${d.tipo}"></span></td>
                        <td th:text="${d.departamento}"></td>
                        <td th:text="${d.municipio}"></td>
                        <td th:text="${d.direccionTexto}"></td>
                        <td th:text="${d.referencia}"></td>
                        <td>
                            <a th:href="@{'/cliente/direcciones/' + ${d.idDireccion} + '/editar'}" class="btn" style="padding: 0.5rem 1rem;">Editar</a>
                            <form th:action="@{'/cliente/direcciones/' + ${d.idDireccion} + '/eliminar'}" method="post" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar esta dirección?');">
                                <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem;">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${direcciones == null or direcciones.isEmpty()}" style="text-align:center; padding: 2rem; color: var(--text-secondary);">
                Aún no tienes direcciones registradas.
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
