<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Drops - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Drops</h2>
            <a href="/admin/drops/nuevo" class="btn">Nuevo Drop</a>
        </div>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Publicación</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${drops}">
                        <td th:text="${d.idDrop}"></td>
                        <td th:text="${d.nombre}"></td>
                        <td th:text="${d.descripcion}"></td>
                        <td th:text="${#strings.substring(d.fechaPublicacion,0,10)}"></td>
                        <td>
                            <span class="badge" th:text="${d.estado}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/drops/' + ${d.idDrop} + '/editar'}" class="btn" style="padding: 0.5rem 1rem;">Editar</a>
                            <form th:action="@{'/admin/drops/' + ${d.idDrop} + '/eliminar'}" method="post" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar este drop?');">
                                <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem;">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
