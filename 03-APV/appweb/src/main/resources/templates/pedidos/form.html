<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Completar Pedido - Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <h2>Crear Pedido</h2>
        
        <div th:replace="~{fragments/messages :: messages}"></div>
        
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div style="display:flex; gap: 1rem; margin-bottom: 2rem;">
                <img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isEmpty()}" th:src="${producto.imagenUrl}" style="width:100px; height:100px; object-fit:cover;" onerror="this.src='/img/placeholder.png'">
                <div>
                    <h3 th:text="${producto.nombre}" style="margin:0;"></h3>
                    <p th:text="${'$' + producto.precio}" style="color:var(--accent); font-weight:bold;"></p>
                    <p style="font-size:0.9rem; color:var(--text-secondary);">Stock disponible: <span th:text="${producto.stock}"></span></p>
                </div>
            </div>

            <form th:action="@{/cliente/pedidos/nuevo}" method="post" th:object="${pedidoRequest}">
                <input type="hidden" name="idProducto" th:value="${producto.idProducto}" />
                
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" name="cantidad" class="form-control" value="1" min="1" th:max="${producto.stock}" required>
                </div>

                <div class="form-group">
                    <label>Dirección de Envío</label>
                    <select th:field="*{idDireccion}" class="form-control" required>
                        <option value="">Seleccione su dirección...</option>
                        <option th:each="d : ${direcciones}" th:value="${d.idDireccion}" th:text="${d.tipo + ' - ' + d.direccionTexto}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Método de Pago</label>
                    <select th:field="*{metodoPago}" class="form-control" required>
                        <option value="CONTRA_ENTREGA">CONTRA ENTREGA</option>
                        <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                        <option value="DEPOSITO">DEPÓSITO</option>
                    </select>
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn" style="width:100%">Confirmar Pedido</button>
                </div>
            </form>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
